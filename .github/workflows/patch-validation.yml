# Validates a version branch's GStreamer patch series before it is merged.
# For pull requests, the version is the PR target branch (for example, 1.28.6).
# For manual runs, the version is the selected branch. The workflow downloads
# matching upstream gst-plugins source archives, creates a temporary Git
# baseline for each component, and applies the repository's patch series with
# git am. Version branches must use the X.Y.Z naming convention.
name: Validate GStreamer patch series

on:
  pull_request:
    branches:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-series:
    name: Apply ${{ matrix.component }} patch series
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gst-plugins-base
            folder: gstreamer1.0-plugins-base
          - component: gst-plugins-good
            folder: gstreamer1.0-plugins-good
          - component: gst-plugins-bad
            folder: gstreamer1.0-plugins-bad
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve target GStreamer version
        id: version
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${PR_BASE_REF:-$REF_NAME}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an X.Y.Z version branch, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download matching upstream source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="${{ matrix.component }}-${VERSION}.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://gstreamer.freedesktop.org/src/${{ matrix.component }}/${archive}"
          tar -xf "$archive"
      - name: Validate and apply patches
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE/${{ matrix.folder }}"/*.patch)
          test "${#patches[@]}" -gt 0
          source_dir="${{ matrix.component }}-${VERSION}"
          git -C "$source_dir" init
          git -C "$source_dir" config user.name patch-validator
          git -C "$source_dir" config user.email patch-validator@example.invalid
          git -C "$source_dir" add -A
          git -C "$source_dir" commit -m baseline
          git -C "$source_dir" am "${patches[@]}"
