# Validates a version branch's GStreamer patch series before it is merged.
# Pull requests validate their target branch; manual dispatch validates the
# branch selected for that run. That version branch (for example, 1.28.6)
# must use the X.Y.Z format, which is also the GStreamer source version.
# The workflow downloads matching upstream gst-plugins source archives, creates
# a temporary Git baseline, and applies each present patch series with git am.
# A package with no local patches is reported as a successful skipped check.
name: Validate GStreamer patch series

on:
  pull_request:
    branches:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-series:
    name: Apply ${{ matrix.component }} patch series
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gst-plugins-base
            folder: gstreamer1.0-plugins-base
          - component: gst-plugins-good
            folder: gstreamer1.0-plugins-good
          - component: gst-plugins-bad
            folder: gstreamer1.0-plugins-bad
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve GStreamer version from the version branch
        id: version
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${PR_BASE_REF:-$REF_NAME}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an X.Y.Z version branch, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check local patch series
        id: patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE/${{ matrix.folder }}"/*.patch)
          if test "${#patches[@]}" -eq 0; then
            echo "No local patches in ${{ matrix.folder }}; validation skipped."
            echo "has_patches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_patches=true" >> "$GITHUB_OUTPUT"
      - name: Download matching upstream source
        if: steps.patches.outputs.has_patches == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="${{ matrix.component }}-${VERSION}.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://gstreamer.freedesktop.org/src/${{ matrix.component }}/${archive}"
          tar -xf "$archive"
      - name: Validate and apply patches
        if: steps.patches.outputs.has_patches == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE/${{ matrix.folder }}"/*.patch)
          source_dir="${{ matrix.component }}-${VERSION}"
          git -C "$source_dir" init
          git -C "$source_dir" config user.name patch-validator
          git -C "$source_dir" config user.email patch-validator@example.invalid
          git -C "$source_dir" add -A
          git -C "$source_dir" commit -m baseline
          git -C "$source_dir" am "${patches[@]}"
